<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZONES HACKER</title>

<style>
body{
background:#000;
color:#00ff00;
font-family:Consolas,monospace;
text-align:center;
margin:0;
padding:0;
overflow-x:hidden;
}

h1{
font-size:60px;
text-shadow:0 0 20px #00ff00;
margin-top:20px;
animation: glow 2s infinite alternate;
}

@keyframes glow{
from{opacity:.7;}
to{opacity:1;}
}

#clock{
font-size:20px;
margin:10px;
}

#country{
font-size:28px;
margin:20px;
color:#7fff7f;
}

#terminal{
width:90%;
margin:auto;
text-align:left;
border:1px solid #00ff00;
padding:15px;
height:220px;
overflow:auto;
box-shadow:0 0 20px #00ff00;
}

#map{
white-space:pre;
font-size:10px;
line-height:1;
color:#00ff00;
margin:20px auto;
}
</style>
</head>

<body>

<h1>ZONES HACKER</h1>

<div id="clock"></div>

<div id="country">Loading...</div>

<div id="map">
           .-""""-.
      .---' WORLD '---.
   .-'                 '-.
 .'      NORTH           '.
|       AMERICA           |
|                          |
| EUROPE     ASIA         |

| AFRICA   OCEANIA        |

   '-.   AMERICA     .-'
      '------------'
</div>

<div id="terminal"></div>

<script>

// Codka soo dhaweynta
window.onload = function(){

const msg = new SpeechSynthesisUtterance(
"Waxaad ku jirtaa page Zones. Soo dhawoow walaal."
);

msg.lang = "so-SO";
msg.rate = 0.9;

speechSynthesis.speak(msg);

};

// Taariikh iyo Waqti
setInterval(()=>{

},1000);

// Wadamada

"Somalia",

"Ethiopia",

"France",
"Japan",
"China"
];

let c = 0;

setInterval(()=>{
document.getElementById("country").innerHTML =
"🌍 " + countries[c];
c=(c+1)%countries.length;
},2000);

// AI Messages
const messages=[
"[AI] Zones System Online",
"[AI] World Network Ready",
"[AI] AI Assistant Connected",
"[AI] Time Synchronization Complete",
"[AI] World Monitor Active",
"[AI] Somalia Connected",
"[AI] Saudi Arabia Connected",
"[AI] Global Status: NORMAL",
"[AI] Welcome To Zones Hacker"
];

let i=0;

function log(){
if(i<messages.length){
document.getElementById("terminal").innerHTML +=
messages[i] + "<br>";

i++;

setTimeout(log,1500);
}
}

log();

</script>

</body>
</html>
